spring:
  application:
    name: equigcc-platform
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/equigcc}
    username: ${DB_USER:equigcc}
    password: ${DB_PASSWORD:equigcc}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # Flyway owns the schema
    properties:
      hibernate.jdbc.time_zone: UTC
  jackson:
    generator:
      write-bigdecimal-as-plain: true   # 1400000, not 1.4E+6
  flyway:
    enabled: true
    locations: classpath:db/migration

equigcc:
  security:
    # HS256 signing secret, min 32 bytes. Override via env in every real environment.
    jwt-secret: ${JWT_SECRET:change-me-change-me-change-me-change-me-0123456789}
    # AES-256 key (base64, 32 bytes) protecting TOTP seeds at rest. The default is for local development only.
    encryption-key: ${ENCRYPTION_KEY:ZGV2LW9ubHktYWVzMjU2LWtleS0wMTIzNDU2Nzg5YWI=}
    access-token-ttl: ${ACCESS_TOKEN_TTL:PT1H}
    max-failed-logins: 5
    lockout: PT15M
  certificates:
    verification-base-url: ${CERT_VERIFY_URL:https://verify.equigcc.com/c/}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
