spring:
  application:
    name: equigcc-platform
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/equigcc}
    username: ${DB_USER:equigcc}
    password: ${DB_PASSWORD:equigcc}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # Flyway owns the schema
    properties:
      hibernate.jdbc.time_zone: UTC
  jackson:
    generator:
      write-bigdecimal-as-plain: true   # 1400000, not 1.4E+6
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health   # nothing else is exposed
  endpoint:
    health:
      probes:
        enabled: true   # /actuator/health/liveness and /readiness
      show-details: never

equigcc:
  security:
    # HS256 signing secret, min 32 bytes. Override via env in every real environment.
    jwt-secret: ${JWT_SECRET:change-me-change-me-change-me-change-me-0123456789}
    # AES-256 key (base64, 32 bytes) protecting TOTP seeds at rest. The default is for local development only.
    encryption-key: ${ENCRYPTION_KEY:ZGV2LW9ubHktYWVzMjU2LWtleS0wMTIzNDU2Nzg5YWI=}
    access-token-ttl: ${ACCESS_TOKEN_TTL:PT15M}
    refresh-token-ttl: ${REFRESH_TOKEN_TTL:P14D}
    max-failed-logins: 5
    lockout: PT15M
  dev:
    # Development and test only. Skips authenticator codes; the app will not start in the prod profile with this on.
    skip-mfa: ${DEV_SKIP_MFA:false}
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:3000}
  mail:
    from: ${MAIL_FROM:no-reply@equigcc.local}
  webhooks:
    enabled: ${WEBHOOKS_ENABLED:true}
    # Local testing only: permits http:// and private addresses as webhook targets.
    allow-insecure: ${WEBHOOKS_ALLOW_INSECURE:false}
    poll-ms: ${WEBHOOKS_POLL_MS:15000}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    auth-per-minute: ${RATE_LIMIT_AUTH_PER_MINUTE:30}
    api-per-minute: ${RATE_LIMIT_API_PER_MINUTE:600}
    trust-forwarded: ${RATE_LIMIT_TRUST_FORWARDED:false}
    store: ${RATE_LIMIT_STORE:memory}
  system:
    version: ${APP_VERSION:dev}
    # Operator token for scheduling maintenance and flipping flags. Empty disables those endpoints.
    admin-token: ${SYSTEM_ADMIN_TOKEN:}
  notices:
    enabled: ${NOTICES_ENABLED:true}
  password-reset:
    token-ttl: PT30M
    max-requests-per-hour: 3
  certificates:
    verification-base-url: ${CERT_VERIFY_URL:http://localhost:3000/verify/}

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"

springdoc:
  swagger-ui:
    path: /swagger-ui.html
