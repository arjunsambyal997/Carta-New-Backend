# Long-lived part of the production stack: HTTPS proxy, Postgres and the backup job. The backend and frontend run as
# separate "colour" projects (docker-compose.backend.yml / docker-compose.frontend.yml) that deploy.sh starts and stops.
#   ./deploy.sh backend v1.2.0      first run also starts this file
#   docker compose -p sijill -f docker-compose.prod.yml --env-file .env ps
name: sijill

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./tls.d:/etc/caddy/tls.d:ro
      - ./certs:/etc/caddy/certs:ro
      - ./errors:/srv/errors:ro
      - ./state/upstreams:/etc/caddy/upstreams:ro
      - caddy_data:/data
      - caddy_config:/config
    logging: *logging

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: equigcc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: equigcc
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U equigcc"]
      interval: 5s
      retries: 20
    # Postgres is not published on the host: only containers on the sijill network reach it.
    shm_size: 256m
    logging: *logging

  backup:
    build: ./backup
    image: sijill-backup:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: equigcc
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: equigcc
      BACKUP_DIR: /backups
      BACKUP_HOUR_UTC: ${BACKUP_HOUR_UTC:-22}
      LOCAL_RETENTION_DAYS: ${BACKUP_LOCAL_RETENTION_DAYS:-7}
      AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
      RCLONE_REMOTE: ${BACKUP_RCLONE_REMOTE:-}
      REMOTE_DAILY_DAYS: ${BACKUP_REMOTE_DAILY_DAYS:-30}
      REMOTE_MONTHLY_DAYS: ${BACKUP_REMOTE_MONTHLY_DAYS:-365}
      BACKUP_PING_URL: ${BACKUP_PING_URL:-}
      # rclone reads its remote from these, so no rclone.conf is needed. The remote is named "offsite".
      RCLONE_CONFIG_OFFSITE_TYPE: s3
      RCLONE_CONFIG_OFFSITE_PROVIDER: ${BACKUP_S3_PROVIDER:-Cloudflare}
      RCLONE_CONFIG_OFFSITE_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_OFFSITE_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
      RCLONE_CONFIG_OFFSITE_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      RCLONE_CONFIG_OFFSITE_NO_CHECK_BUCKET: "true"
    volumes:
      - ${BACKUP_PATH:-./backups}:/backups
    logging: *logging

networks:
  default:
    name: sijill

volumes:
  pgdata:
  caddy_data:
  caddy_config:
