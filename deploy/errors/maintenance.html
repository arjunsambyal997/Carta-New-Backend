<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="60">
<title>Sijill: scheduled maintenance</title>
<style>
  :root { color-scheme: light dark; --bg: #f8fafc; --card: #fff; --text: #0f172a; --muted: #475569; --brand: #0f766e; --line: #e2e8f0; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0b1220; --card: #111a2b; --text: #e2e8f0; --muted: #94a3b8; --line: #1e293b; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
         font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Arabic", sans-serif; }
  main { max-width: 34rem; margin: 1rem; padding: 2rem; background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
  h1 { font-size: 1.25rem; margin: 0 0 .5rem; color: var(--brand); }
  p { margin: 0 0 1rem; color: var(--muted); }
  hr { border: 0; border-top: 1px solid var(--line); margin: 1.5rem 0; }
  [dir=rtl] { text-align: right; }
</style>
</head>
<body>
<main>
  <section lang="en">
    <h1>Sijill is being updated</h1>
    <p>We are applying a scheduled update. Your data is safe and nothing is lost. This page refreshes by itself every minute.</p>
  </section>
  <hr>
  <section lang="ar" dir="rtl">
    <h1>يجري تحديث سجل</h1>
    <p>نقوم حالياً بتطبيق تحديث مجدول. بياناتك آمنة ولن يُفقد شيء. تتحدث هذه الصفحة تلقائياً كل دقيقة.</p>
  </section>
</main>
</body>
</html>
