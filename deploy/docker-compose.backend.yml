# One colour (blue or green) of the backend. deploy.sh runs it as project sijill-backend-<colour> with
# state/backend-<colour>.env supplying COLOR, BACKEND_IMAGE and APP_VERSION. Do not start it by hand.
name: sijill-backend-${COLOR:?COLOR is set by deploy.sh}

services:
  backend:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is set by deploy.sh}
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      APP_VERSION: ${APP_VERSION:-unknown}
      DB_URL: jdbc:postgresql://db:5432/equigcc
      DB_USER: equigcc
      DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env}
      SYSTEM_ADMIN_TOKEN: ${SYSTEM_ADMIN_TOKEN:-}
      PUBLIC_BASE_URL: https://${DOMAIN}
      CERT_VERIFY_URL: https://${DOMAIN}/verify/
      MAIL_FROM: ${MAIL_FROM:?set MAIL_FROM in .env}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:?set SPRING_MAIL_HOST in .env}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "true"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "true"
      # Caddy overwrites X-Forwarded-For with the real client address, so rate limits count the client.
      RATE_LIMIT_TRUST_FORWARDED: "true"
      # Two colours overlap during a deploy; sign-in limits must be shared between them.
      RATE_LIMIT_STORE: database
      JAVA_TOOL_OPTIONS: ${BACKEND_JAVA_OPTS:--XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError}
    mem_limit: ${BACKEND_MEM_LIMIT:-3g}
    # Longer than spring.lifecycle.timeout-per-shutdown-phase, so in-flight requests finish before the kill.
    stop_grace_period: 45s
    networks:
      sijill:
        aliases:
          - backend-${COLOR}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  sijill:
    external: true
