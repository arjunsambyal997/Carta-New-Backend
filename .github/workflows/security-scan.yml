name: Dependency vulnerability scan

# Weekly and on demand. Kept apart from ci.yml, and not run on pull requests, so a newly published CVE (or an
# NVD download that fails without an API key) never blocks an unrelated PR.
on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  owasp-dependency-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # An NVD API key (repo secret NVD_API_KEY) makes the database download minutes instead of hours.
      - name: OWASP dependency-check (fail on CVSS >= 7)
        run: >
          ./mvnw -B org.owasp:dependency-check-maven:check
          -DfailBuildOnCVSS=7 -DnvdApiKey=${{ secrets.NVD_API_KEY }}
