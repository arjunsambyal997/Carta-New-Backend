name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests
        run: ./mvnw -B verify

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco

      - name: Build jar
        run: ./mvnw -B package -DskipTests

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t equigcc-backend .

      - name: Validate compose files
        run: |
          docker compose -f docker-compose.yml config -q
          DOMAIN=example.com POSTGRES_PASSWORD=x JWT_SECRET=x ENCRYPTION_KEY=x MAIL_FROM=a@example.com SPRING_MAIL_HOST=smtp.example.com docker compose -f deploy/docker-compose.prod.yml config -q
