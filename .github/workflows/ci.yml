name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests
        run: ./mvnw -B verify

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: target/site/jacoco

      - name: Build jar
        run: ./mvnw -B package -DskipTests

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t sijill-backend:test .

      - name: Validate compose files
        run: |
          docker compose -f docker-compose.yml config -q
          cp deploy/.env.example /tmp/ci.env
          POSTGRES_PASSWORD=x docker compose -f deploy/docker-compose.prod.yml --env-file /tmp/ci.env config -q
          POSTGRES_PASSWORD=x JWT_SECRET=x ENCRYPTION_KEY=x SPRING_MAIL_HOST=smtp.example.com \
            COLOR=blue BACKEND_IMAGE=x docker compose -f deploy/docker-compose.backend.yml --env-file /tmp/ci.env config -q
          COLOR=blue FRONTEND_IMAGE=x docker compose -f deploy/docker-compose.frontend.yml --env-file /tmp/ci.env config -q

      - name: Lint deploy scripts
        run: |
          shellcheck -x -S warning deploy/*.sh deploy/test/*.sh
          shellcheck -s sh -S warning deploy/backup/*.sh

      # Runs the real production scripts against this image: blue-green switch under load with zero failed requests,
      # rollback, a release that never gets ready, maintenance page, notices, flags, encrypted backup and restore drill.
      - name: Blue-green deploy test
        run: BACKEND_TEST_IMAGE=sijill-backend:test deploy/test/bluegreen-test.sh

  migrations:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Expand/contract rule: an applied migration is never edited, renamed or deleted; changes ship as a new file.
      # Flyway would refuse to start in production on a checksum mismatch, so catch it here instead.
      - name: Applied migrations are unchanged
        run: |
          base="origin/${{ github.base_ref }}"
          changed=$(git diff --name-only --diff-filter=DMR "$base"...HEAD -- src/main/resources/db/migration)
          if [ -n "$changed" ]; then
            echo "::error::Existing migrations were changed; add a new V<n>__*.sql instead:"
            echo "$changed"
            exit 1
          fi
